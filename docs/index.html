<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanie loty z Warszawy</title>
<script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1" data-cmp-ab="2">

      var script = document.createElement("script");
      script.async = 1;
      script.setAttribute("data-cmp-ab","2");
      script.src = 'https://emrldtp.cc/NTgzNzU0.js?t=583754';
      document.head.appendChild(script);
  })();
</script>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #5c6470;
    --accent: #073590;
    --price: #0a7d3b;
    --badge: #d92d20;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131a;
      --card: #1b2030;
      --text: #e8eaf0;
      --muted: #9aa3b2;
      --accent: #7aa2ff;
      --price: #4ade80;
      --badge: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header { padding: 20px 16px 8px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .updated, .desc { color: var(--muted); font-size: 0.85rem; margin: 0 0 4px; }
  .controls {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    padding: 8px 16px 16px;
  }
  .controls label { font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
  .controls input[type=checkbox] { width: 20px; height: 20px; }
  .controls select {
    font-size: 0.95rem; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--muted); background: var(--card); color: var(--text);
  }
  main { padding: 0 16px 40px; max-width: 640px; margin: 0 auto; }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border-radius: 14px; padding: 16px;
    margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  .card:active { transform: scale(.99); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .price { font-size: 1.6rem; font-weight: 700; color: var(--price); }
  .route { font-weight: 600; font-size: 1.05rem; }
  .city { font-size: 1.1rem; font-weight: 600; }
  .country, .times, .airline { color: var(--muted); font-size: 0.9rem; }
  .note { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
  .group { display: block; margin-bottom: 12px; }
  .group .card { margin-bottom: 0; }
  details summary {
    color: var(--muted); font-size: 0.85rem; cursor: pointer;
    padding: 8px 4px 0; list-style-position: inside;
  }
  .alt {
    display: block; text-decoration: none; color: var(--text);
    font-size: 0.9rem; padding: 7px 4px;
    border-bottom: 1px solid rgba(128,128,128,.15);
  }
  .alt:last-child { border-bottom: none; }
  .alt .muted { color: var(--muted); }
  .badge {
    display: inline-block; background: var(--badge); color: #fff;
    font-size: 0.72rem; font-weight: 700; letter-spacing: .03em;
    padding: 3px 8px; border-radius: 999px; margin-top: 8px;
  }
  .badge small { font-weight: 400; opacity: .9; }
  .empty, .error { text-align: center; color: var(--muted); padding: 48px 16px; }
  @media (min-width: 720px) {
    h1 { font-size: 1.9rem; }
  }
</style>
</head>
<body>
<header>
  <h1>Tanie loty z Warszawy</h1>
  <p class="updated" id="updated"></p>
  <p class="desc" id="desc"></p>
  <p class="desc" id="srcwarn"></p>
</header>

<div class="controls">
  <label><input type="checkbox" id="onlyLow"> Tylko rekordowe</label>
  <label>Sortuj:
    <select id="sort">
      <option value="price">po cenie</option>
      <option value="date">po dacie</option>
    </select>
  </label>
  <label>Linia:
    <select id="airline">
      <option value="">wszystkie linie</option>
    </select>
  </label>
  <label><input type="checkbox" id="groupBy" checked> Grupuj po kierunku</label>
</div>

<main id="list"></main>

<script>
const DNI = ["nd", "pn", "wt", "śr", "cz", "pt", "so"];

function fmtData(iso) {
  const d = new Date(iso + "T00:00:00");
  return DNI[d.getDay()] + " " +
    String(d.getDate()).padStart(2, "0") + "." +
    String(d.getMonth() + 1).padStart(2, "0");
}

function fmtCena(v) {
  return Math.round(v) + " zł";
}

let deals = [], cfg = null;

const noce = n => n === 1 ? "1 noc" : (n >= 2 && n <= 4 ? n + " noce" : n + " nocy");

function kartaHtml(d, showBadge) {
  const low = showBadge !== undefined ? showBadge : d.record_low;
  return `
    <a class="card" href="${d.link}" target="_blank" rel="noopener">
      <div class="row">
        <span class="price">${fmtCena(d.price)}</span>
        <span class="route">${d.origin} → ${d.dest}</span>
      </div>
      <div class="row">
        <span class="city">${d.dest_city}${d.dest_country ? ", " + d.dest_country : ""}</span>
        <span class="times">${fmtData(d.date_out)} → ${fmtData(d.date_in)} (${noce(d.nights)})</span>
      </div>
      <div class="row">
        <span class="times">${d.time_out} – ${d.time_in}</span>
        <span class="airline">${d.airline} · ${d.source === "aviasales" ? "Aviasales" : "ryanair.com"}</span>
      </div>
      ${d.note ? '<div class="note">' + d.note + '</div>' : ''}
      ${low ? '<span class="badge">REKORDOWO TANIO' +
        (d.median_price ? ' <small>· mediana ' + fmtCena(d.median_price) + '</small>' : '') +
        '</span>' : ''}
    </a>`;
}

function render() {
  const onlyLow = document.getElementById("onlyLow").checked;
  const sort = document.getElementById("sort").value;
  const airline = document.getElementById("airline").value;
  const groupBy = document.getElementById("groupBy").checked;
  const list = document.getElementById("list");

  let items = deals.filter(d => (!onlyLow || d.record_low) &&
                                (!airline || d.airline === airline));
  items.sort((a, b) => sort === "date"
    ? a.date_out.localeCompare(b.date_out) || a.price - b.price
    : a.price - b.price);

  if (!items.length) {
    list.innerHTML = '<p class="empty">Brak okazji poniżej progu — sprawdź później</p>';
    return;
  }

  if (!groupBy) {
    list.innerHTML = items.map(d => kartaHtml(d)).join("");
    return;
  }

  // Grupy po mieście docelowym (kilka lotnisk jednego miasta = jedna grupa).
  const groups = new Map();
  for (const d of items) {
    const key = (d.dest_city || d.dest) + "|" + (d.dest_country || "");
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(d);
  }
  let gr = [...groups.values()];
  // Reprezentant grupy = najtańsza oferta; reszta po cenie.
  gr.forEach(g => g.sort((a, b) => a.price - b.price));
  gr.sort((a, b) => sort === "date"
    ? a[0].date_out.localeCompare(b[0].date_out) || a[0].price - b[0].price
    : a[0].price - b[0].price);

  list.innerHTML = gr.map(g => {
    const [main, ...rest] = g;
    const anyLow = g.some(d => d.record_low);
    const alts = rest.length
      ? `<details><summary>+${rest.length} ` +
        (rest.length === 1 ? "inny termin" : rest.length <= 4 ? "inne terminy" : "innych terminów") +
        ` (od ${fmtCena(rest[0].price)})</summary>` +
        rest.map(d => `
          <a class="alt" href="${d.link}" target="_blank" rel="noopener">
            ${fmtData(d.date_out)} → ${fmtData(d.date_in)} (${noce(d.nights)})
            · <strong>${fmtCena(d.price)}</strong>
            · ${d.airline} <span class="muted">· ${d.dest}</span>
          </a>`).join("") + "</details>"
      : "";
    return '<div class="group">' + kartaHtml(main, anyLow) + alts + "</div>";
  }).join("");
}

document.getElementById("onlyLow").addEventListener("change", render);
document.getElementById("sort").addEventListener("change", render);
document.getElementById("airline").addEventListener("change", render);
document.getElementById("groupBy").addEventListener("change", render);

fetch("deals.json", { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(data => {
    deals = data.deals || [];
    cfg = data.config || {};
    document.getElementById("updated").textContent =
      "Zaktualizowano: " + new Date(data.generated_at).toLocaleString("pl-PL");
    document.getElementById("desc").textContent =
      "Loty w dwie strony do " + cfg.max_price_pln + " zł, " +
      cfg.min_nights + "–" + cfg.max_nights + " nocy, najbliższe " +
      cfg.days_ahead + " dni";
    if (!(data.sources || []).includes("aviasales")) {
      document.getElementById("srcwarn").textContent =
        "Źródło: tylko Ryanair (Aviasales nieaktywne — brak tokena)";
    }
    const sel = document.getElementById("airline");
    [...new Set(deals.map(d => d.airline).filter(Boolean))].sort()
      .forEach(a => {
        const o = document.createElement("option");
        o.value = a; o.textContent = a;
        sel.appendChild(o);
      });
    render();
  })
  .catch(e => {
    document.getElementById("list").innerHTML =
      '<p class="error">Nie udało się wczytać okazji (' + e.message +
      '). Odśwież stronę za chwilę.</p>';
  });
</script>
</body>
</html>
