@keyframes pulse { to { transform: scale(2.2); opacity: 0 } }
.list { margin: 16px 0 8px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center }

footer { padding: 26px 0 34px; text-align: center; color: var(--muted); font-size: .85rem }
