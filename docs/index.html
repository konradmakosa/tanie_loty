<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #5c6470;
    --accent: #073590;
    --price: #0a7d3b;
    --badge: #d92d20;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131a;
      --card: #1b2030;
      --text: #e8eaf0;
      --muted: #9aa3b2;
      --accent: #7aa2ff;
      --price: #4ade80;
      --badge: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header { padding: 20px 16px 8px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .updated, .desc { color: var(--muted); font-size: 0.85rem; margin: 0 0 4px; }
  .tabs {
    display: flex; gap: 4px; padding: 8px 16px 0;
    border-bottom: 1px solid rgba(128,128,128,.25);
  }
  .tabs button {
    flex: 1; max-width: 200px; min-height: 44px;
    font-size: 1rem; font-weight: 600;
    background: none; border: none; color: var(--muted);
    border-bottom: 3px solid transparent; cursor: pointer;
  }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .controls {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    padding: 8px 16px 16px;
  }
  .controls label { font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
  .controls input[type=checkbox] { width: 20px; height: 20px; }
  .controls select {
    font-size: 0.95rem; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--muted); background: var(--card); color: var(--text);
  }
  main, #settings { padding: 0 16px 40px; max-width: 640px; margin: 0 auto; }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border-radius: 14px; padding: 16px;
    margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.12);
    cursor: pointer;
  }
  .card:active { transform: scale(.99); }
  .offers { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
  .offers a { color: var(--accent); text-decoration: none; }
  .direct {
    display: inline-block; margin-top: 8px; padding: 6px 14px;
    border: 1px solid var(--accent); border-radius: 999px;
    color: var(--accent); font-size: 0.85rem; font-weight: 600;
    text-decoration: none;
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .price { font-size: 1.6rem; font-weight: 700; color: var(--price); }
  .route { font-weight: 600; font-size: 1.05rem; }
  .city { font-size: 1.1rem; font-weight: 600; }
  .country, .times, .airline { color: var(--muted); font-size: 0.9rem; }
  .note { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
  .badge {
    display: inline-block; background: var(--badge); color: #fff;
    font-size: 0.72rem; font-weight: 700; letter-spacing: .03em;
    padding: 3px 8px; border-radius: 999px; margin-top: 8px;
  }
  .badge small { font-weight: 400; opacity: .9; }
  .group { display: block; margin-bottom: 12px; }
  .group .card { margin-bottom: 0; }
  details summary {
    color: var(--muted); font-size: 0.85rem; cursor: pointer;
    padding: 8px 4px 0; list-style-position: inside;
  }
  .alt {
    display: block; text-decoration: none; color: var(--text);
    font-size: 0.9rem; padding: 7px 4px;
    border-bottom: 1px solid rgba(128,128,128,.15);
  }
  .alt:last-child { border-bottom: none; }
  .alt .muted { color: var(--muted); }
  .vs { font-size: 0.8rem; font-weight: 600; }
  .vs.neg { color: var(--price); }
  .vs.neu { color: var(--muted); font-weight: 400; }
  .vs.pos { color: var(--badge); }
  details.hist summary { font-size: 0.8rem; }
  .hist-body { padding: 4px; }
  .hist-cap { font-size: 0.75rem; color: var(--muted); display: flex;
              justify-content: space-between; }
  .empty, .error { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty a { color: var(--accent); }
  /* Ustawienia */
  .field { margin-bottom: 18px; }
  .field label.t { display: block; font-weight: 600; margin-bottom: 4px; }
  .field .help { color: var(--muted); font-size: 0.8rem; margin-bottom: 6px; }
  .field input[type=number] {
    width: 110px; min-height: 44px; font-size: 1rem;
    padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--muted); background: var(--card); color: var(--text);
  }
  .field .inline { display: flex; gap: 10px; align-items: center; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    min-width: 44px; min-height: 44px; padding: 0 12px;
    border-radius: 999px; border: 1px solid var(--muted);
    background: var(--card); color: var(--muted);
    font-size: 0.9rem; cursor: pointer;
  }
  .pill.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .checks { display: flex; flex-direction: column; gap: 2px; }
  .checks label {
    display: flex; align-items: center; gap: 10px;
    min-height: 44px; font-size: 0.95rem;
  }
  .checks input[type=checkbox], .field > label input[type=checkbox] {
    width: 22px; height: 22px;
  }
  .btn {
    min-height: 44px; padding: 0 20px; border-radius: 10px;
    border: 1px solid var(--muted); background: var(--card); color: var(--text);
    font-size: 0.95rem; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .actions { display: flex; gap: 10px; margin-top: 24px; }
  .mini { font-size: 0.8rem; color: var(--accent); background: none;
          border: none; cursor: pointer; padding: 4px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 10px 22px;
    border-radius: 999px; font-size: 0.95rem; opacity: 0;
    transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  @media (min-width: 720px) {
    h1 { font-size: 1.9rem; }
  }
</style>

<body>

<div id="viewOkazje">

  <p class="desc" id="farCounts"></p>
  <p class="desc" id="farSettingsLine"></p>
  <p class="desc" id="farUpdated"></p>
</header>

<div class="controls">
  <label>Sortuj:
    <select id="fSort">
      <option value="price">po cenie</option>
      <option value="date">po dacie</option>
    </select>

  <label>Linia:
    <select id="fAirline">

<section id="settings" style="display:none">
  <div class="field">
    <label class="t" for="sPriceLcc">Maksymalna cena — tanie linie (zł)</label>

  <div class="field">
    <label class="t" for="sPriceFull">Maksymalna cena — linie tradycyjne (zł)</label>

    <input type="number" id="sPriceFull" min="0" step="10">
  </div>

  <div class="field">
    <label class="t">Liczba nocy</label>
    <div class="help" id="sNightsHelp"></div>
    <div class="inline">
      <input type="number" id="sNightsMin" min="1" step="1"> od

  <div class="field">

    <button class="btn" id="sReset">Przywróć domyślne</button>
  </div>
</section>

<div class="toast" id="toast">Zapisano</div>

<script>
const API_BASE = "https://makosa.org/tanie_loty/api";

const DNI = ["nd", "pn", "wt", "śr", "cz", "pt", "so"];
const DNI_KROTKIE = ["Pn", "Wt", "Śr", "Cz", "Pt", "So", "Nd"];

function fmtData(iso) {
  const d = new Date(iso + "T00:00:00");
  return DNI[d.getDay()] + " " +
    String(d.getDate()).padStart(2, "0") + "." +
    String(d.getMonth() + 1).padStart(2, "0");
}

function fmtCena(v) {
  return Math.round(v) + " zł";
}

const noce = n => n === 1 ? "1 noc" : (n >= 2 && n <= 4 ? n + " noce" : n + " nocy");

let deals = [], cfg = {}, settings = null;
let farDeals = [], farCfg = {};
let activeTab = "okazje";

/* GA4 — bez awarii przy zablokowanym skrypcie. */
function track(name, params) {
  if (typeof gtag === "function") gtag("event", name, params);
}

/* ---------- ustawienia ---------- */

function defaults() {
  return {
    maxPriceLcc: 250,
    maxPriceFull: 700,
    nightsMin: 2,
    nightsMax: 5,
    daysOut: [0, 1, 2, 3, 4, 5, 6],   // 0=pn … 6=nd
    daysIn: [0, 1, 2, 3, 4, 5, 6],
    horizonDays: cfg.days_ahead || 120,
    origins: null,                   // null = wszystkie z danych
    excludedCountries: [],
    directOnly: true,
    showDomestic: false,
    // Zakładka „Daleko" — osobne filtry (prefiks far*).
    farMaxPrice: 2500,
    farNightsMin: 7,
    farNightsMax: 21,
    farHorizonDays: farCfg.days_ahead || 270,
    farMaxTransfers: 1,
    farExcludedCountries: []
  };
}

function loadSettings() {
  let s;
  try {
    s = Object.assign({}, defaults(),
      JSON.parse(localStorage.getItem("tl_settings") || "{}"));
  } catch (e) {
    return defaults();
  }
  // Migracja ze starego klucza maxPrice.
  if ("maxPrice" in s) {
    s.maxPriceLcc = s.maxPrice;
    delete s.maxPrice;
  }
  return s;
}

function saveSettings(s) {
  localStorage.setItem("tl_settings", JSON.stringify(s));
}

/* Czysta funkcja filtrująca — testowalna poza DOM. */
function applySettings(deals, s, cfg, today) {
  const horizon = new Date(today);
  horizon.setDate(horizon.getDate() + (s.horizonDays || cfg.days_ahead || 365));
  const horizonIso = horizon.toISOString().slice(0, 10);
  const origins = s.origins || null;
  const excl = new Set(s.excludedCountries || []);
  return deals.filter(d =>
    d.price <= (d.category === "lcc" ? s.maxPriceLcc : s.maxPriceFull) &&
    d.nights >= s.nightsMin && d.nights <= s.nightsMax &&
    s.daysOut.includes(d.weekday_out) &&
    s.daysIn.includes(d.weekday_in) &&
    d.date_out <= horizonIso &&
    (!origins || origins.includes(d.origin)) &&
    !excl.has(d.dest_country) &&
    (!s.directOnly || d.transfers === 0) &&
    (s.showDomestic || !d.domestic)
  );
}

/* Filtry zakładki „Daleko" — czysta funkcja, testowalna. */
function applyFarSettings(deals, s, cfgFar, today) {
  const horizon = new Date(today);
  horizon.setDate(horizon.getDate() +
                  (s.farHorizonDays || cfgFar.days_ahead || 365));
  const horizonIso = horizon.toISOString().slice(0, 10);
  const excl = new Set(s.farExcludedCountries || []);
  const maxT = s.farMaxTransfers;
  return deals.filter(d =>
    d.price <= s.farMaxPrice &&
    d.nights >= s.farNightsMin && d.nights <= s.farNightsMax &&
    d.date_out <= horizonIso &&
    (d.transfers_out === undefined || d.transfers_out <= maxT) &&
    (d.transfers_in === undefined || d.transfers_in <= maxT) &&
    !excl.has(d.dest_country)
  );
}

function isDefault(s) {
  return JSON.stringify(s) === JSON.stringify(defaults());
}

function settingsSummary(s) {
  if (isDefault(s)) return "ustawienia domyślne";
  const parts = ["tanie do " + s.maxPriceLcc + " zł",
    "tradycyjne do " + s.maxPriceFull + " zł",
    s.nightsMin + "–" + s.nightsMax + " nocy"];
  if (s.daysOut.length < 7) {
    const labels = s.daysOut.slice().sort().map(i => DNI_KROTKIE[i].toLowerCase());
    parts.push("wylot " + labels.join(", "));
  }
  if (s.daysIn.length < 7) {
    const labels = s.daysIn.slice().sort().map(i => DNI_KROTKIE[i].toLowerCase());
    parts.push("powrót " + labels.join(", "));
  }
  if (s.horizonDays < (cfg.days_ahead || Infinity))
    parts.push("do " + s.horizonDays + " dni");
  if (s.origins && s.origins.length < allOrigins().length)
    parts.push("z " + s.origins.join(", "));
  const excl = s.excludedCountries || [];
  if (excl.length)
    parts.push("bez: " + excl.slice(0, 2).join(", ") +
      (excl.length > 2 ? " (+" + (excl.length - 2) + ")" : ""));
  if (!s.directOnly) parts.push("również z przesiadką");
  if (s.showDomestic) parts.push("+ krajowe");
  return parts.join(" · ");
}

function allOrigins() {
  return [...new Set(deals.map(d => d.origin))].sort();
}

function allCountries() {
  return [...new Set(deals.map(d => d.dest_country).filter(Boolean))].sort();
}

/* ---------- renderowanie kart ---------- */

function fmtDur(min) {
  if (!min) return "";
  return Math.floor(min / 60) + "h " + String(min % 60).padStart(2, "0");
}

function transferText(d) {
  const t = [d.transfers_out, d.transfers_in];
  const legs = t.map(n => n === 0 ? "bezpośrednio" : n + " przesiadka")
    .join(", z powrotem ");
  const dur = [fmtDur(d.duration_out_min), fmtDur(d.duration_in_min)]
    .filter(Boolean).join(" / ");
  return legs + (dur ? " · ≈ " + dur : "");
}

function dealLink(d) {
  return d.link || ((d.offers || [])[0] || {}).link || "";
}

function kartaHtml(d, showBadge) {
  const low = showBadge !== undefined ? showBadge : d.record_low;
  const offers = d.offers || [];
  const offersHtml = offers.length > 1
    ? '<div class="offers">Ceny: ' + offers.map(o =>
        `<a href="${o.link}" target="_blank" rel="noopener" data-id="${d.id}" data-via="${o.label}">` +
        `${o.label} ${fmtCena(o.price)}</a>`).join(" · ") + "</div>"
    : "";
  const directHtml = (d.direct_link && d.source !== "ryanair")
    ? `<a class="direct" href="${d.direct_link}" target="_blank" rel="noopener"` +
      ` data-id="${d.id}" data-via="direct">Kup bezpośrednio: ${d.direct_label} →</a>`
    : "";
  return `
    <div class="card" data-href="${dealLink(d)}" data-id="${d.id}" data-via="${offers[0] ? offers[0].label : ""}">
      <div class="row">
        <span class="price">${fmtCena(d.price)}</span>
        <span class="route">${d.origin} → ${d.dest}</span>
      </div>
      ${d.vs_typical !== null && d.vs_typical !== undefined
        ? '<div><span class="vs ' + (d.vs_typical <= -15 ? "neg" :
          d.vs_typical > 15 ? "pos" : "neu") + '">' +
          (d.vs_typical > 0 ? "+" : "") + d.vs_typical +
          "% vs typowo " + fmtCena(d.typical_price) + "</span></div>"
        : ""}
      <div class="row">
        <span class="city">${d.dest_city}${d.dest_country ? ", " + d.dest_country : ""}</span>
        <span class="times">${fmtData(d.date_out)} → ${fmtData(d.date_in)} (${noce(d.nights)})</span>
      </div>
      <div class="row">
        <span class="times">${d.time_out} – ${d.time_in}</span>
        <span class="airline">${d.airline} · ${d.category === "full" ? "tradycyjna" : "tania"} · ${d.source === "aviasales" ? "Aviasales" : "ryanair.com"}</span>
      </div>
      ${d.note ? '<div class="note">' + d.note + '</div>' : ''}
      ${d.transfers_out !== undefined
        ? '<div class="note">' + transferText(d) + '</div>' : ''}
      ${offersHtml}
      ${directHtml}
      ${low ? '<span class="badge">REKORDOWO TANIO' +
        (d.median_price ? ' <small>· mediana ' + fmtCena(d.median_price) + '</small>' : '') +
        '</span>' : ''}
    </div>`;
}

function render() {
  const onlyLow = document.getElementById("onlyLow").checked;
  const sort = document.getElementById("sort").value;
  const airline = document.getElementById("airline").value;
  const category = document.getElementById("category").value;
  const groupBy = document.getElementById("groupBy").checked;

  // Najpierw ustawienia użytkownika, potem szybkie filtry.
  let items = applySettings(deals, settings, cfg, new Date());
  items = items.filter(d => (!onlyLow || d.record_low) &&
                            (!airline || d.airline === airline) &&
                            (!category || d.category === category));
  renderList(items, "list", sort, groupBy, deals.length > 0);
}

function renderFar() {
  const sort = document.getElementById("fSort").value;
  const airline = document.getElementById("fAirline").value;
  const onlyDirect = document.getElementById("fTransfers").value === "0";
  const groupBy = document.getElementById("fGroupBy").checked;

  let items = applyFarSettings(farDeals, settings, farCfg, new Date());
  items = items.filter(d => (!airline || d.airline === airline) &&
                            (!onlyDirect || d.transfers === 0));
  renderList(items, "listFar", sort, groupBy, farDeals.length > 0);
}

function renderList(items, listId, sort, groupBy, anyData) {
  const list = document.getElementById(listId);
  items = items.slice().sort((a, b) => sort === "date"
    ? a.date_out.localeCompare(b.date_out) || a.price - b.price
    : a.price - b.price);

  if (!items.length) {
    list.innerHTML = anyData
      ? '<p class="empty">Brak okazji dla tych ustawień — ' +
        '<a href="#ustawienia">poluzuj filtry w zakładce Ustawienia</a></p>'
      : '<p class="empty">Brak danych — poczekaj na następne wyszukiwanie</p>';
    return;
  }

  if (!groupBy) {
    list.innerHTML = items.map(d => kartaHtml(d)).join("");
    return;
  }

  // Grupy po mieście docelowym (kilka lotnisk jednego miasta = jedna grupa).
  const groups = new Map();
  for (const d of items) {
    const key = (d.dest_city || d.dest) + "|" + (d.dest_country || "");
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(d);
  }
  let gr = [...groups.values()];
  gr.forEach(g => g.sort((a, b) => a.price - b.price));
  gr.sort((a, b) => sort === "date"
    ? a[0].date_out.localeCompare(b[0].date_out) || a[0].price - b[0].price
    : a[0].price - b[0].price);

  list.innerHTML = gr.map(g => {
    const [main, ...rest] = g;
    const anyLow = g.some(d => d.record_low);
    // Widoczność linii tradycyjnych, gdy reprezentant jest tani.
    let legacy = "";
    if (main.category !== "full") {
      const f = g.find(d => d.category === "full");
      if (f)
        legacy = `<div class="offers"><a href="${dealLink(f)}" ` +
          `target="_blank" rel="noopener" data-id="${f.id}">` +
          `Linią tradycyjną od ${fmtCena(f.price)} (${f.airline})</a></div>`;
    }
    const alts = rest.length
      ? `<details><summary>+${rest.length} ` +
        (rest.length === 1 ? "inny termin" : rest.length <= 4 ? "inne terminy" : "innych terminów") +
        ` (od ${fmtCena(rest[0].price)})</summary>` +
        rest.map(d => `
          <a class="alt" href="${dealLink(d)}" target="_blank" rel="noopener" data-id="${d.id}"
             data-via="${d.source === "aviasales" ? "Aviasales" : "ryanair.com"}">
            ${fmtData(d.date_out)} → ${fmtData(d.date_in)} (${noce(d.nights)})
            · <strong>${fmtCena(d.price)}</strong>
            · ${d.airline} <span class="muted">· ${d.dest}
            · ${d.source === "aviasales" ? "Aviasales" : "ryanair.com"}</span>
          </a>`).join("") + "</details>"
      : "";
    return '<div class="group">' + kartaHtml(main, anyLow) + legacy + alts +
      histDetails(main) + "</div>";
  }).join("");
}

/* ---------- historia cen (mini-wykres) ---------- */

function histDetails(d) {
  return '<details class="hist" data-route="' + d.origin + '-' + d.dest + '">' +
    '<summary>Historia ceny ▸ ' + d.origin + ' → ' + d.dest + '</summary>' +
    '<div class="hist-body"></div></details>';
}

// Fetch z timeoutem — do zapytań do API (baza może nie odpowiadać).
function apiGet(path, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 4000);
  return fetch(API_BASE + path, { signal: ctl.signal })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .finally(() => clearTimeout(t));
}

// Typowa cena z pełnej bazy (nadpisuje statyczną, gdy >= 5 dni danych).
function applyApiTypical(list, tab, rerender) {
  apiGet("/typical.php?tab=" + tab).then(map => {
    if (!map || typeof map !== "object") return;
    let changed = false;
    list.forEach(d => {
      const t = map[d.origin + "-" + d.dest];
      if (t && t.n_days >= 5 && t.typical_90d) {
        d.typical_price = t.typical_90d;
        d.vs_typical = Math.round((d.price / t.typical_90d - 1) * 100);
        changed = true;
      }
    });
    if (changed) rerender();
  }).catch(() => {});
}

/* Czysta funkcja skalująca — testowalna poza DOM. */
function scalePoints(points, w, h) {
  const xs = points.map(p => Date.parse(p[0]));
  const ys = points.map(p => p[1]);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const dx = (x1 - x0) || 1, dy = (y1 - y0) || 1;
  return points.map(p => ({
    x: (Date.parse(p[0]) - x0) / dx * (w - 16) + 8,
    y: h - 12 - (p[1] - y0) / dy * (h - 20)
  }));
}

function drawHistory(canvas, pts, route) {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const line = css.getPropertyValue("--accent").trim() || "#073590";
  const dot = css.getPropertyValue("--price").trim() || "#0a7d3b";
  const muted = css.getPropertyValue("--muted").trim() || "#888";

  const scaled = scalePoints(pts, w, h);
  ctx.strokeStyle = line;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  scaled.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.stroke();
  const last = scaled[scaled.length - 1];
  ctx.fillStyle = dot;
  ctx.beginPath();
  ctx.arc(last.x, last.y, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = muted;
  ctx.font = "10px sans-serif";
  const prices = pts.map(p => p[1]);
  ctx.fillText(Math.round(Math.min.apply(null, prices)) + " zł", 8, h - 2);
  ctx.fillText("max " + Math.round(Math.max.apply(null, prices)) + " zł",
               w - 70, 12);
  ctx.fillText(route, 8, 12);
}

// Leniwy fetch po rozwinięciu <details.hist>.
document.getElementById("list").addEventListener("toggle", onHistToggle, true);
document.getElementById("listFar").addEventListener("toggle", onHistToggle, true);
function onHistToggle(e) {
  const det = e.target;
  if (!(det instanceof HTMLDetailsElement) || !det.open ||
      !det.classList.contains("hist") || det.dataset.loaded)
    return;
  det.dataset.loaded = "1";
  const route = det.dataset.route;
  track("view_history", { route: route });
  const body = det.querySelector(".hist-body");
  // Najpierw pełna historia z API; fallback na statyczny plik trasy.
  apiGet("/history.php?route=" + route).then(data => {
    const pts = (data.daily || []).slice(-90);
    if (pts.length < 3) throw new Error("mało danych");
    const c = document.createElement("canvas");
    c.width = 320; c.height = 80;
    body.appendChild(c);
    drawHistory(c, pts, route);
    const cap = document.createElement("div");
    cap.className = "hist-cap";
    cap.innerHTML = "<span>" + pts[0][0].slice(0, 10) + "</span>" +
      "<span>dziś: " + Math.round(pts[pts.length - 1][1]) + " zł</span>";
    body.appendChild(cap);
    // Typowa cena wg miesiąca wylotu (mediany z >= 3 dniami, maks. 6).
    const mo = data.by_month || {};
    const lines = Object.keys(mo).sort().slice(0, 6).map(m => {
      const vals = mo[m].map(p => p[1]).sort((a, b) => a - b);
      if (vals.length < 3) return null;
      const med = vals.length % 2 ? vals[(vals.length - 1) / 2]
        : (vals[vals.length / 2 - 1] + vals[vals.length / 2]) / 2;
      return m + " wylotu: typowo " + Math.round(med) + " zł";
    }).filter(Boolean);
    if (lines.length) {
      const div = document.createElement("div");
      div.className = "hist-cap muted";
      div.textContent = lines.join(" · ");
      body.appendChild(div);
    }
  }).catch(() => {
    fetch("history/" + route + ".json", { cache: "default" })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(data => {
        const pts = (data.points || []).slice(-90);
        if (pts.length < 3) {
          const first = pts.length ? pts[0][0].slice(0, 10) : "?";
          body.textContent = "Za mało danych (zbieramy od " + first + ")";
          return;
        }
        const c = document.createElement("canvas");
        c.width = 320; c.height = 80;
        body.appendChild(c);
        drawHistory(c, pts, route);
        const cap = document.createElement("div");
        cap.className = "hist-cap";
        cap.innerHTML = "<span>" + pts[0][0].slice(0, 10) + "</span>" +
          "<span>dziś: " + Math.round(pts[pts.length - 1][1]) + " zł</span>";
        body.appendChild(cap);
      })
      .catch(() => { body.textContent = "Brak historii tej trasy."; });
  });
}

/* ---------- zakładki ---------- */

function showTab(tab) {
  activeTab = tab;
  track("view_tab", { tab: tab });
  document.getElementById("tabOkazje").classList.toggle("active", tab === "okazje");
  document.getElementById("tabDaleko").classList.toggle("active", tab === "daleko");
  document.getElementById("tabUstawienia").classList.toggle("active", tab === "ustawienia");
  document.getElementById("viewOkazje").style.display = tab === "okazje" ? "" : "none";
  document.getElementById("viewDaleko").style.display = tab === "daleko" ? "" : "none";
  document.getElementById("settings").style.display = tab === "ustawienia" ? "" : "none";
}

document.getElementById("tabOkazje").onclick = () => { location.hash = ""; showTab("okazje"); };
document.getElementById("tabDaleko").onclick = () => { location.hash = "daleko"; showTab("daleko"); };
document.getElementById("tabUstawienia").onclick = () => { location.hash = "ustawienia"; showTab("ustawienia"); };
window.addEventListener("hashchange", () => showTab(tabFromHash()));

function tabFromHash() {
  if (location.hash === "#ustawienia") return "ustawienia";
  if (location.hash === "#daleko") return "daleko";
  return "okazje";
}

/* ---------- formularz ustawień ---------- */

function pillGroup(el, key) {
  const box = document.getElementById(el);
  box.innerHTML = "";
  DNI_KROTKIE.forEach((label, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pill" + (settings[key].includes(i) ? " on" : "");
    b.textContent = label;
    b.onclick = () => {
      const arr = settings[key];
      const idx = arr.indexOf(i);
      if (idx >= 0) arr.splice(idx, 1); else arr.push(i);
      b.classList.toggle("on");
    };
    box.appendChild(b);
  });
}

function fillSettingsForm() {
  const mp = cfg.max_price_pln || {};
  document.getElementById("sPriceLcc").value = settings.maxPriceLcc;
  document.getElementById("sPriceLcc").max = mp.lcc || "";
  document.getElementById("sPriceLccHelp").textContent =
    "koperta skryptu: " + mp.lcc + " zł (tanie) / " + mp.full + " zł (tradycyjne)";
  document.getElementById("sPriceFull").value = settings.maxPriceFull;
  document.getElementById("sPriceFull").max = mp.full || "";
  document.getElementById("sPriceFullHelp").textContent =
    "linie jak LOT, Lufthansa, KLM — skrypt zbiera do " + mp.full + " zł";
  document.getElementById("sNightsMin").value = settings.nightsMin;
  document.getElementById("sNightsMax").value = settings.nightsMax;
  document.getElementById("sNightsHelp").textContent =
    "koperta skryptu: " + cfg.min_nights + "–" + cfg.max_nights + " nocy";
  document.getElementById("sHorizon").value = settings.horizonDays;
  document.getElementById("sHorizon").max = cfg.days_ahead || "";
  document.getElementById("sHorizonHelp").textContent =
    "maks. " + cfg.days_ahead + " dni (tyle zbiera skrypt)";
  document.getElementById("sDirect").checked = settings.directOnly;
  document.getElementById("sDomestic").checked = settings.showDomestic;

  document.getElementById("sFarPrice").value = settings.farMaxPrice;
  document.getElementById("sFarPrice").max = farCfg.max_price_pln || "";
  document.getElementById("sFarPriceHelp").textContent =
    "koperta skryptu: " + (farCfg.max_price_pln || "—") + " zł";
  document.getElementById("sFarNightsMin").value = settings.farNightsMin;
  document.getElementById("sFarNightsMax").value = settings.farNightsMax;
  document.getElementById("sFarNightsHelp").textContent =
    "koperta skryptu: " + farCfg.min_nights + "–" + farCfg.max_nights + " nocy";
  document.getElementById("sFarHorizon").value = settings.farHorizonDays;
  document.getElementById("sFarHorizon").max = farCfg.days_ahead || "";
  document.getElementById("sFarHorizonHelp").textContent =
    "maks. " + farCfg.days_ahead + " dni (tyle zbiera skrypt)";
  document.getElementById("sFarTransfers").value = String(settings.farMaxTransfers);

  pillGroup("sDaysOut", "daysOut");
  pillGroup("sDaysIn", "daysIn");

  const origins = settings.origins || allOrigins();
  document.getElementById("sOrigins").innerHTML = allOrigins().map(o => `
    <label><input type="checkbox" data-origin="${o}"
      ${origins.includes(o) ? "checked" : ""}> ${o}</label>`).join("");

  renderCountries();
  renderFarCountries();
}

function renderCountries() {
  const excl = new Set(settings.excludedCountries);
  document.getElementById("sCountries").innerHTML = allCountries().map(c => `
    <label><input type="checkbox" data-country="${c}"
      ${excl.has(c) ? "" : "checked"}> ${c}</label>`).join("");
  document.querySelectorAll("#sCountries input").forEach(cb =>
    cb.addEventListener("change", () => {
      const set = new Set(settings.excludedCountries);
      if (cb.checked) set.delete(cb.dataset.country);
      else set.add(cb.dataset.country);
      settings.excludedCountries = [...set];
    }));
}

document.getElementById("sCountriesAll").onclick = () => {
  settings.excludedCountries = [];
  renderCountries();
};
document.getElementById("sCountriesNone").onclick = () => {
  settings.excludedCountries = allCountries();
  renderCountries();
};

function farCountries() {
  return [...new Set(farDeals.map(d => d.dest_country).filter(Boolean))].sort();
}

function renderFarCountries() {
  const excl = new Set(settings.farExcludedCountries || []);
  document.getElementById("sFarCountries").innerHTML = farCountries().map(c => `
    <label><input type="checkbox" data-country="${c}"
      ${excl.has(c) ? "" : "checked"}> ${c}</label>`).join("");
  document.querySelectorAll("#sFarCountries input").forEach(cb =>
    cb.addEventListener("change", () => {
      const set = new Set(settings.farExcludedCountries || []);
      if (cb.checked) set.delete(cb.dataset.country);
      else set.add(cb.dataset.country);
      settings.farExcludedCountries = [...set];
    }));
}

document.getElementById("sFarCountriesAll").onclick = () => {
  settings.farExcludedCountries = [];
  renderFarCountries();
};
document.getElementById("sFarCountriesNone").onclick = () => {
  settings.farExcludedCountries = farCountries();
  renderFarCountries();
};

function farSummary(s) {
  const parts = ["do " + s.farMaxPrice + " zł",
    s.farNightsMin + "–" + s.farNightsMax + " nocy",
    "maks. " + s.farMaxTransfers + " przesiadka"];
  const excl = s.farExcludedCountries || [];
  if (excl.length)
    parts.push("bez: " + excl.slice(0, 2).join(", ") +
      (excl.length > 2 ? " (+" + (excl.length - 2) + ")" : ""));
  return parts.join(" · ");
}

document.getElementById("sSave").onclick = () => {
  settings.maxPriceLcc = +document.getElementById("sPriceLcc").value || 0;
  settings.maxPriceFull = +document.getElementById("sPriceFull").value || 0;
  settings.nightsMin = +document.getElementById("sNightsMin").value || 1;
  settings.nightsMax = +document.getElementById("sNightsMax").value || 1;
  settings.horizonDays = Math.min(+document.getElementById("sHorizon").value || cfg.days_ahead,
                                cfg.days_ahead);
  settings.directOnly = document.getElementById("sDirect").checked;
  settings.showDomestic = document.getElementById("sDomestic").checked;
  settings.farMaxPrice = +document.getElementById("sFarPrice").value || 0;
  settings.farNightsMin = +document.getElementById("sFarNightsMin").value || 1;
  settings.farNightsMax = +document.getElementById("sFarNightsMax").value || 1;
  settings.farHorizonDays = Math.min(
    +document.getElementById("sFarHorizon").value || farCfg.days_ahead,
    farCfg.days_ahead || 365);
  settings.farMaxTransfers = +document.getElementById("sFarTransfers").value;
  const checked = [...document.querySelectorAll("#sOrigins input:checked")]
    .map(cb => cb.dataset.origin);
  settings.origins = checked.length === allOrigins().length ? null : checked;
  saveSettings(settings);
  track("save_settings", {
    max_price_lcc: settings.maxPriceLcc,
    max_price_full: settings.maxPriceFull,
    nights: settings.nightsMin + "-" + settings.nightsMax,
    days_out: settings.daysOut.length,
    excluded_countries: (settings.excludedCountries || []).length,
    direct_only: settings.directOnly
  });
  document.getElementById("settingsLine").textContent = settingsSummary(settings);
  document.getElementById("farSettingsLine").textContent = farSummary(settings);
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
  location.hash = "";
  showTab("okazje");
  render();
  renderFar();
};

document.getElementById("sReset").onclick = () => {
  settings = defaults();
  fillSettingsForm();
};

/* ---------- start ---------- */

document.getElementById("onlyLow").addEventListener("change", render);
document.getElementById("sort").addEventListener("change", render);
document.getElementById("airline").addEventListener("change", render);
document.getElementById("category").addEventListener("change", render);
document.getElementById("groupBy").addEventListener("change", render);
document.getElementById("fSort").addEventListener("change", renderFar);
document.getElementById("fAirline").addEventListener("change", renderFar);
document.getElementById("fTransfers").addEventListener("change", renderFar);
document.getElementById("fGroupBy").addEventListener("change", renderFar);

// Kliknięcia w oferty (delegacja na obie listy).
["list", "listFar"].forEach(id =>
  document.getElementById(id).addEventListener("click", e => {
  const el = e.target.closest("[data-id]");
  if (!el) return;
  const d = deals.find(x => x.id === el.dataset.id) ||
            farDeals.find(x => x.id === el.dataset.id);
  if (!d) return;
  track("select_deal", {
    deal_id: d.id, destination: d.dest_city, country: d.dest_country,
    price: d.price, airline: d.airline, source: d.source, nights: d.nights,
    category: d.category, via: el.dataset.via || "", tab: activeTab
  });
  // Karta-div: klik poza wewnętrznymi linkami otwiera ofertę główną.
  if (!e.target.closest("a") && el.dataset.href)
    window.open(el.dataset.href, "_blank", "noopener");
}));

Promise.all([
  fetch("deals.json", { cache: "no-store" }).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }),
  // far.json może jeszcze nie istnieć — zakładka Daleko pokaże stan pusty.
  fetch("far.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null)
    .catch(() => null)
]).then(([data, farData]) => {
    deals = data.deals || [];
    cfg = data.config || {};
    settings = loadSettings();
    document.getElementById("updated").textContent =
      "Zaktualizowano: " + new Date(data.generated_at).toLocaleString("pl-PL");
    const mp = cfg.max_price_pln || {};
    document.getElementById("desc").textContent =
      "Skrypt zbiera oferty do " + (mp.lcc || cfg.max_price_pln) +
      " zł (tanie) / " + mp.full + " zł (tradycyjne), " +
      cfg.min_nights + "–" + cfg.max_nights + " nocy, najbliższe " +
      cfg.days_ahead + " dni — zawęź w Ustawieniach";
    const c = data.counts || {};
    const cParts = [];
    if (c.ryanair) cParts.push("Ryanair " + c.ryanair + " ofert");
    if (c.aviasales) cParts.push("Aviasales " + c.aviasales + " ofert");
    if (cParts.length)
      document.getElementById("countsLine").textContent =
        "Źródła: " + cParts.join(" · ");
    document.getElementById("settingsLine").textContent = settingsSummary(settings);
    if (!(data.sources || []).includes("aviasales")) {
      document.getElementById("srcwarn").textContent =
        "Źródło: tylko Ryanair (Aviasales nieaktywne — brak tokena)";
    }
    const sel = document.getElementById("airline");
    [...new Set(deals.map(d => d.airline).filter(Boolean))].sort()
      .forEach(a => {
        const o = document.createElement("option");
        o.value = a; o.textContent = a;
        sel.appendChild(o);
      });
    fillSettingsForm();

    // Zakładka „Daleko".
    if (farData) {
      farDeals = farData.deals || [];
      farCfg = farData.config || {};
      document.getElementById("farUpdated").textContent =
        "Zaktualizowano: " + new Date(farData.generated_at).toLocaleString("pl-PL");
      document.getElementById("farDesc").textContent =
        "Skrypt zbiera oferty poza Europą do " + farCfg.max_price_pln +
        " zł, " + farCfg.min_nights + "–" + farCfg.max_nights +
        " nocy, do " + farCfg.max_transfers_each_way +
        " przesiadki, najbliższe " + farCfg.days_ahead + " dni";
      const fc = (farData.counts || {}).aviasales;
      if (fc) document.getElementById("farCounts").textContent =
        "Źródło: Aviasales " + fc + " ofert";
      const fSel = document.getElementById("fAirline");
      [...new Set(farDeals.map(d => d.airline).filter(Boolean))].sort()
        .forEach(a => {
          const o = document.createElement("option");
          o.value = a; o.textContent = a;
          fSel.appendChild(o);
        });
    }
    // Po wczytaniu farCfg odświeżamy domyślny horyzont i formularz.
    document.getElementById("farSettingsLine").textContent = farSummary(settings);
    fillSettingsForm();

    showTab(tabFromHash());
    render();
    renderFar();
    // Typowe ceny z pełnej bazy (API może nie działać — wtedy statyczne).
    applyApiTypical(deals, "okazje", render);
    applyApiTypical(farDeals, "daleko", renderFar);
  })
  .catch(e => {
    document.getElementById("list").innerHTML =
      '<p class="error">Nie udało się wczytać okazji (' + e.message +
      '). Odśwież stronę za chwilę.</p>';
  });
</script>
