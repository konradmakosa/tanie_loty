<div class="bar" id="bar"><span id="barmsg">Wybierz lotnisko wylotu</span><a class="coffee2" href="https://buycoffee.to/konradmakosa" target="_blank" rel="noopener"><img src="postaw-kawe.png" alt="Postaw kawę" style="height:24px;width:24px;object-fit:cover;object-position:left;display:block"></a></div>
<a class="coffee" href="https://buycoffee.to/konradmakosa" target="_blank" rel="noopener"><img src="postaw-kawe.png" alt="Postaw kawę"></a>
<script>
document.querySelectorAll('a.ap.on').forEach(function (a) {
  a.addEventListener("click", function (e) {
    e.preventDefault();
    var ap = a.getAttribute("data-ap") || "waw";
    try { localStorage.setItem("airport", ap); } catch (err) {}
    gtag("event", "select_airport", { airport: ap });
    location.href = a.getAttribute("href");
  });
});
(function () {
  var mob = matchMedia("(max-width: 480px)").matches;
  if (mob) {
    document.querySelector("svg.pl")
      .setAttribute("preserveAspectRatio", "xMidYMin meet");
    document.getElementById("barmsg").textContent = "Wybierz lotnisko";
  }
  var wybor = /[?&]wybor/.test(location.search) || location.hash === "#wybor";
  var saved = null;
  try { saved = localStorage.getItem("airport"); } catch (e) {}
  var bar = document.getElementById("bar");
  var msg = document.getElementById("barmsg");

  // Geolokalizacja po IP — miękka sugestia najbliższego lotniska.
  // Baza IP≈miasto bywa mylna na LTE (często "Warszawa"), więc to
  // tylko podpowiedź w pasku + podświetlenie znacznika, nie redirect.
  var near = null;
  var APS = [
    ["WAW", "Warszawa", 52.30, 20.80],   // Okęcie + Modlin
    ["KRK", "Kraków", 50.0777, 19.7848],
    ["GDN", "Gdańsk", 54.3776, 18.4662],
    ["KTW", "Katowice", 50.4743, 19.08],
    ["WRO", "Wrocław", 51.1027, 16.8858],
    ["POZ", "Poznań", 52.421, 16.8263],
    ["RZE", "Rzeszów", 50.11, 22.019],
    ["LUZ", "Lublin", 51.2403, 22.7136],
    ["BZG", "Bydgoszcz", 53.0968, 17.9777],
    ["SZZ", "Szczecin", 53.5847, 14.9022],
    ["LCJ", "Łódź", 51.7219, 19.3981]
  ];
  function dist(lat1, lon1, lat2, lon2) {
    var r = Math.PI / 180, dlat = (lat2 - lat1) * r, dlon = (lon2 - lon1) * r;
    var a = Math.sin(dlat / 2) * Math.sin(dlat / 2) +
      Math.cos(lat1 * r) * Math.cos(lat2 * r) *
      Math.sin(dlon / 2) * Math.sin(dlon / 2);
    return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  var ACTIVE_IATA = { WAW: 1, KRK: 1, GDN: 1 };
  function suggest() {
    if (!near || ACTIVE_IATA[near.iata]) return "";
    return (mob ? "Najbliżej: " + near.iata + " (wkrótce) · "
                : "Najbliższe Ci: " + near.city + " — wkrótce. ");
  }
  function paintNear() {
    document.querySelectorAll(".ap").forEach(function (g) {
      var t = g.querySelector(".iata");
      if (t && near && t.textContent.indexOf(near.iata) === 0) {
        g.classList.add("near");
      }
    });
  }
  try {
    var ac = new AbortController();
    var to = setTimeout(function () { ac.abort(); }, 2500);
    fetch("https://get.geojs.io/v1/ip/geo.json", { signal: ac.signal })
      .then(function (r) { return r.json(); })
      .then(function (g) {
        var lat = parseFloat(g.latitude), lon = parseFloat(g.longitude);
        if (!isFinite(lat) || !isFinite(lon)) return;
        var best = null, bd = 1e9;
        APS.forEach(function (a) {
          var d = dist(lat, lon, a[2], a[3]);
          if (d < bd) { bd = d; best = a; }
        });
        if (best && bd < 300) {
          near = { iata: best[0], city: best[1], km: Math.round(bd) };
          paintNear();
          gtag("event", "geo_suggest",
               { airport: near.iata, distance_km: near.km });
          render();
        }
      })
      .catch(function () {})
      .finally(function () { clearTimeout(to); });
  } catch (e) {}

  // Aktywne porty: sugestia geo kieruje odliczanie do najbliższego
  // aktywnego lotniska, nie zawsze do Warszawy.
  var ACTIVE = { waw: ["WAW", "Warszawy", "zwarszawy/"],
                 krk: ["KRK", "Krakowa", "zkrakowa/"],
                 gdn: ["GDN", "Gdańska", "zgdanska/"] };
  function target() {
    for (var k in ACTIVE)
      if (near && near.iata === ACTIVE[k][0]) return ACTIVE[k];
    return ACTIVE.waw;
  }
  function render(n) {
    var s = suggest();
    if (n === undefined) {           // stan "zostań / wybierz"
      msg.textContent = s +
        (mob ? "Wybierz lotnisko" : "Wybierz lotnisko wylotu");
      return;
    }
    var tg = target();
    msg.innerHTML = s + (mob
      ? "Do " + tg[1] + " za <b>" + n + "…</b>"
      : "Przenoszę do lotów z " + tg[1] + " za <b>" + n + "…</b>");
  }

  if (wybor || saved) {              // ?wybor: tylko wskazówka; saved: redirect w head
    render();
    return;
  }
  var n = 3, t;
  function tick() {
    render(n);
    if (n <= 0) { location.replace(target()[2]); return; }
    n -= 1; t = setTimeout(tick, 1000);
  }
  var btn = document.createElement("button");
  btn.textContent = mob ? "Zostań" : "Zostań na mapie";
  btn.addEventListener("click", function () {
    clearTimeout(t);
    render();
    btn.remove();
  });
  bar.appendChild(btn);
  tick();
})();
</script>
</body>
</html>
