<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b1733">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
{{ROBOTS}}
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE_URL}}">
<meta name="twitter:card" content="summary_large_image">
{{JSONLD}}
<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CTFYNF714B"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', { 'analytics_storage': 'granted', 'ad_storage': 'denied', 'ad_user_data': 'denied', 'ad_personalization': 'denied' });
  gtag('js', new Date());
  gtag('config', 'G-CTFYNF714B', { anonymize_ip: true });
</script>
<style>
:root {
  --text: #e8eaf0; --muted: #9aa3b2; --accent: #7aa2ff; --price: #4ade80;
  --card: rgba(255,255,255,.045); --line: rgba(255,255,255,.11);
}
* { margin: 0; box-sizing: border-box }
body {
  color: var(--text); min-height: 100vh;
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(180deg, #0b1733 0%, #121c34 50%, #171c2b 100%);
}
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 18px 60px }
.top { display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 26px }
.top a.home { display: flex; align-items: center; gap: 10px;
  text-decoration: none }
.top img { height: 40px; width: auto; border-radius: 8px; display: block }
.top .back { color: var(--muted); font-size: .85rem; text-decoration: none }
.top .back:hover { color: var(--accent) }
.crumb { color: var(--muted); font-size: .8rem; margin-bottom: 10px }
.crumb a { color: var(--muted); text-decoration: none }
.crumb a:hover { color: var(--accent) }
.hero {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 26px 24px; margin-bottom: 18px;
}
.hero h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: .01em }
.hero h1 .iata { color: var(--muted); font-weight: 500; font-size: .85em }
.hero .sub { color: var(--muted); margin-top: 6px; font-size: .92rem }
.hero .row { display: flex; flex-wrap: wrap; align-items: end; gap: 18px;
  margin-top: 18px }
.price .v { font-size: 2.4rem; font-weight: 800; color: var(--price);
  line-height: 1 }
.price .lbl { color: var(--muted); font-size: .78rem; margin-top: 4px }
.hero .dates { font-size: .9rem; color: var(--text); padding-bottom: 6px }
.hero .dates span { color: var(--muted) }
a.cta {
  display: inline-block; margin-left: auto; padding: 13px 26px;
  background: var(--price); color: #0b1733; border-radius: 999px;
  font-weight: 700; font-size: .98rem; text-decoration: none;
}
a.cta:hover { filter: brightness(1.08) }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  margin-bottom: 18px }
.grid .cell { background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px }
.cell .k { color: var(--muted); font-size: .72rem; text-transform: uppercase;
  letter-spacing: .06em }
.cell .v2 { font-size: 1.05rem; font-weight: 700; margin-top: 6px }
.card { background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 20px 22px; margin-bottom: 18px }
.card h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { background: rgba(122,162,255,.12); border: 1px solid rgba(122,162,255,.3);
  color: var(--accent); border-radius: 999px; padding: 5px 13px;
  font-size: .82rem }
.chip.g { background: rgba(74,222,128,.1); border-color: rgba(74,222,128,.3);
  color: var(--price) }
table { width: 100%; border-collapse: collapse; font-size: .88rem }
th { color: var(--muted); font-weight: 500; text-align: left;
  font-size: .74rem; text-transform: uppercase; letter-spacing: .05em;
  padding: 6px 8px; border-bottom: 1px solid var(--line) }
td { padding: 9px 8px; border-bottom: 1px solid rgba(255,255,255,.06) }
td.p { color: var(--price); font-weight: 700; white-space: nowrap }
td.num, th.num { text-align: right }
tr:last-child td { border-bottom: none }
td a { color: var(--accent); text-decoration: none; font-weight: 600 }
.links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.links a {
  display: block; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 11px 13px; color: var(--text);
  text-decoration: none; font-size: .85rem;
}
.links a:hover { border-color: rgba(122,162,255,.5) }
.links a .mp { display: block; color: var(--price); font-weight: 700;
  font-size: .8rem; margin-top: 3px }
.note { color: var(--muted); font-size: .78rem; margin-top: 14px }
.foot { text-align: center; font-size: .72rem; color: var(--muted);
  margin-top: 34px }
.foot a { color: var(--muted); text-decoration: none }
.foot a:hover { color: var(--accent) }
@media (max-width: 640px) {
  .grid { grid-template-columns: repeat(2, 1fr) }
  .links { grid-template-columns: repeat(2, 1fr) }
  a.cta { margin-left: 0; width: 100%; text-align: center }
  .hero h1 { font-size: 1.35rem }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="home" href="/"><img src="/assets/logo-96.png" alt="polataj.se"></a>
    <a class="back" href="/loty/">← wszystkie trasy</a>
  </div>
{{BODY}}
  <div class="foot"><a href="/prywatnosc/">Prywatność</a> · <a id="contactLink" href="#">Kontakt</a> · polataj.se</div>
</div>
<script>
document.getElementById("contactLink").href = "mailto:" + ["kontakt","polataj.se"].join("@");
document.querySelectorAll("a[data-deal]").forEach(function(a){
  a.addEventListener("click", function(){
    gtag("event", "select_deal", { trip: "pseo", route: a.getAttribute("data-deal") });
  });
});
</script>
</body>
</html>
