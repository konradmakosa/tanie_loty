name: Szukaj tanich lotów

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - search.py
      - config.json

permissions:
  contents: write

concurrency:
  group: szukaj-tanich-lotow
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz okazje
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: python search.py

      - name: Wyślij do bazy
        continue-on-error: true
        env:
          TL_API_BASE: ${{ secrets.TL_API_BASE }}
          TL_INGEST_KEY: ${{ secrets.TL_INGEST_KEY }}
        run: python ingest.py

      - name: Wgraj stronę na home.pl
        continue-on-error: true
        env:
          TL_FTP_HOST: ${{ secrets.TL_FTP_HOST }}
          TL_FTP_USER: ${{ secrets.TL_FTP_USER }}
          TL_FTP_PASS: ${{ secrets.TL_FTP_PASS }}
          TL_WEB_DIR: ${{ secrets.TL_WEB_DIR }}
        run: python deploy_site.py

      - name: Zapisz wyniki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/zwarszawy/ data/history.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizacja okazji"
          # Pliki generowane: przy konflikcie z równoległym przebiegiem
          # zostawiamy nasze (świeższe) — "theirs" w rebase to nasz commit.
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
