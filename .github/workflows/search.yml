name: Szukaj tanich lotów

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - search.py
      - config.json

permissions:
  contents: write

concurrency:
  group: szukaj-tanich-lotow
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz okazje
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: python search.py

      - name: Wyślij do bazy
        continue-on-error: true
        env:
          TL_API_BASE: ${{ secrets.TL_API_BASE }}
          TL_INGEST_KEY: ${{ secrets.TL_INGEST_KEY }}
        run: python ingest.py

      - name: Zapisz wyniki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deals.json docs/far.json docs/history/ data/history.jsonl
          git diff --cached --quiet || (git commit -m "Aktualizacja okazji" && git pull --rebase && git push)
